version: "3.8"

services:
  hadoop-spark:
    build: .
    image: hdfs-spark:latest
    container_name: hadoop-spark
    environment:
      - CLUSTER_NAME=single-node
      - HDFS_NAMENODE=true
      - HDFS_DATANODE=true
      - SPARK_MODE=master
      - HADOOP_HEAPSIZE=512
      - HADOOP_NAMENODE_HEAPSIZE=512
      - HADOOP_DATANODE_HEAPSIZE=512
      - HADOOP_SECONDARYNAMENODE_HEAPSIZE=256
      - SPARK_DRIVER_MEMORY=512m
      - SPARK_EXECUTOR_MEMORY=512m
      - HDFS_NAMENODE_USER=root
      - HDFS_DATANODE_USER=root
      - HDFS_SECONDARYNAMENODE_USER=root
    volumes:
      - ./hdfs/namenode:/hadoop/dfs/name
      - ./hdfs/datanode:/hadoop/dfs/data
    ports:
      - "9870:9870"  # HDFS Web UI
      - "8081:8080"  # Spark Web UI
      - "7077:7077"  # Spark Master
    networks:
      - bigdata
    mem_reservation: 1g

  opengauss:
    image: opengauss/opengauss-server:latest
    container_name: opengauss
    environment:
      - GS_PASSWORD=GaussDB@2025
    ports:
      - "5432:5432"
    volumes:
      - ./opengauss/data:/var/lib/opengauss
      - ./opengauss/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gaussdb"]
      interval: 10s
      retries: 10
    mem_reservation: 512m
    networks:
      - bigdata

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    environment:
      - SERVICE_NAME=hiveserver2
      - HADOOP_HEAPSIZE=512
      - HIVE_HEAPSIZE=512
    ports:
      - "10000:10000"
    volumes:
      - ./hdfs/warehouse:/warehouse
      - ./hive/init.hql:/opt/hive-init/init.hql:ro
    depends_on:
      - hadoop-spark
    networks:
      - bigdata
    mem_reservation: 512m

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/logs:/logs
    networks:
      - bigdata
    mem_reservation: 512m

networks:
  bigdata:
    driver: bridge
