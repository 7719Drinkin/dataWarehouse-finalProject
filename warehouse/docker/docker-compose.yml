services:
  hadoop-spark:
    build: .
    image: hdfs-spark:latest
    container_name: hadoop-spark
    environment:
      - CLUSTER_NAME=single-node
      - HDFS_NAMENODE=true
      - HDFS_DATANODE=true
      - SPARK_MODE=master
    volumes:
      - ./hdfs/namenode:/hadoop/dfs/name
      - ./hdfs/datanode:/hadoop/dfs/data
    ports:
      - "9870:9870"
      - "8081:8080"
      - "7077:7077"
    networks:
      - bigdata

  opengauss:
    image: opengauss/opengauss-server:latest
    container_name: opengauss
    environment:
      - GS_PASSWORD=GaussDB@2025
    ports:
      - "5432:5432"
    volumes:
      - ./opengauss/data:/var/lib/opengauss
      - ./opengauss/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gaussdb"]
      interval: 10s
      retries: 10

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    environment:
      - SERVICE_NAME=hiveserver2
      # JVM内存设置
      - HIVE_HEAPSIZE=2048
      - HADOOP_HEAPSIZE=2048
      # Hive优化参数
      - HIVE_OPTS=-Xmx2g -Xms2g -XX:ParallelGCThreads=2 -XX:ConcGCThreads=1
    ports:
      - "10000:10000"
    volumes:
      - ./hdfs/warehouse:/warehouse
      - ./hive/init.hql:/opt/hive-init/init.hql:ro
    depends_on:
      - hadoop-spark
    networks:
      - bigdata
    # 资源限制配置
    deploy:
      resources:
        limits:
          cpus: '1.5'        # 最多使用1.5个CPU核心
          memory: 4G         # 最多使用4GB内存
        reservations:
          cpus: '0.5'        # 预留0.5个CPU核心
          memory: 2G         # 预留2GB内存
    # 或者使用传统方式(docker-compose v2语法)
    # cpus: 1.5
    # mem_limit: 4g
    # mem_reservation: 2g

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/import:/var/lib/neo4j/import
      - ./neo4j/logs:/logs
    networks:
      - bigdata

networks:
  bigdata:
    driver: bridge